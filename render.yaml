services:
  # Frontend — React + Vite, Static Site
  - type: web
    name: spa-occupancy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL pública del servicio spa-occupancy-backend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend — pendiente del PR con el código real (ver backend/README.md).
  # Ajustar buildCommand/startCommand al framework final (ejemplo: FastAPI).
  - type: web
    name: spa-occupancy-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
